<div class="tooltip-trigger">
  <span
    class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-outline-variant text-sm"
    >search</span
  >
  <input
    id="search-input"
    type="text"
    [value]="query()"
    (input)="onInput($event)"
    placeholder="Filter logs (regex supported) [/]"
    class="w-full bg-background border border-outline-variant rounded py-1 pl-8 pr-8 text-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-outline-variant/50"
  />
  @if (logState.searchQuery()) {
    <button
      (click)="clearSearch()"
      class="absolute right-2 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors"
    >
      <span class="material-symbols-outlined text-sm">close</span>
    </button>
  }
  <span class="tooltip tooltip-bottom"
    >Filter logs <kbd class="px-1 rounded bg-surface-container text-on-surface">/</kbd></span
  >
</div>
