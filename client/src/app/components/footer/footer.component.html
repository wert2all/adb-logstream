<footer
  class="bg-surface-container border-t border-outline-variant py-1 px-4 flex justify-between items-center text-xs text-outline-variant shrink-0"
>
  <div class="flex gap-4">
    <span><kbd class="bg-surface-variant px-1 rounded text-on-surface">C</kbd> Clear</span>
    <span><kbd class="bg-surface-variant px-1 rounded text-on-surface">/</kbd> Search</span>
    <span><kbd class="bg-surface-variant px-1 rounded text-on-surface">Esc</kbd> Cancel</span>
  </div>
  <div class="flex gap-3">
    <span>
      <kbd class="bg-surface-variant px-1 rounded text-on-surface">V</kbd>-<kbd
        class="bg-surface-variant px-1 rounded text-on-surface"
        >F</kbd
      >
      Toggle Levels</span
    >
    <label class="flex items-center gap-1 cursor-pointer select-none">
      <input
        type="checkbox"
        class="accent-primary cursor-pointer"
        [checked]="logState.autoScrollEnabled()"
        (change)="onToggle($event)"
      />
      <span class="flex items-center gap-1">
        <span><kbd class="bg-surface-variant px-1 rounded text-on-surface">A</kbd>uto-scroll:</span>
        <span
          class="w-2 h-2 rounded-full {{
            logState.autoScrollEnabled() ? 'bg-secondary' : 'bg-outline-variant'
          }}"
          attr.aria-label="{{
            logState.autoScrollEnabled() ? 'Autoscroll is enabled' : 'Autoscroll is disabled'
          }}"
        ></span>
      </span>
    </label>
  </div>
</footer>
