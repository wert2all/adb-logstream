name: Release Application

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Type-check
        run: npm run lint

      - name: Initialize Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Release-it
        run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build client and server
        run: npm run build

      - name: Prepare Release Artifacts
        run: |
          mkdir -p adb-logstream-release
          cp -r server/dist adb-logstream-release/server-dist
          cp -r client/dist adb-logstream-release/client-dist
          cp package.json adb-logstream-release/
          cp package-lock.json adb-logstream-release/
          zip -r adb-logstream-release.zip adb-logstream-release

      - name: Upload Artifacts to existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          files: adb-logstream-release.zip
        if: always()
